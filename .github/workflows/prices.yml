name: Daily prices

# Two triggers, because GitHub's schedule started no run on 19 or 20 November 2026: this
# schedule, and a Vercel schedule that asks GitHub to start the run (vercel.json,
# src/lib/scrape/dispatch.ts). Whichever comes second finds today's prices in and stops.
on:
  schedule:
    # 03:17 UTC is 05:17 in South Africa. GitHub delays scheduled runs under load, and
    # drops some when it's busy enough; the start of the hour is the busiest time.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Read the stores even if today's prices are already in
        type: boolean
        default: false

permissions:
  contents: write

# Never two runs at once: both would write the data files.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Alerts are sent only when these secrets are set (see README, "Price alerts").
      ALERTS_SECRET: ${{ secrets.ALERTS_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTS_FROM: ${{ secrets.ALERTS_FROM }}
    steps:
      - uses: actions/checkout@v7

      # A run queued behind another starts from the commit before that one's prices, so it
      # pulls them first.
      - name: Check whether today's prices are in
        id: fresh
        if: ${{ !inputs.force }}
        run: |
          git pull --ff-only origin main
          today=$(TZ=Africa/Johannesburg date +%F)
          if [ "$(jq -r .pricedOn data/catalogue.json)" = "$today" ]; then
            echo "Prices for $today are already in; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.fresh.outputs.skip != 'true'

      # A store that can't be read, or whose prices fail a sanity check, keeps its last good
      # prices and is named in this step's outputs. When no store's read can be published
      # the step fails, which stops the run here.
      - name: Read the stores
        id: scrape
        if: steps.fresh.outputs.skip != 'true'
        run: npm run scrape

      - name: Commit the new prices
        if: steps.fresh.outputs.skip != 'true'
        run: |
          if git diff --quiet data/; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.scrape.outputs.catalogue_changed }}" = "true" ]; then
            MSG="chore(data): refresh prices"
          else
            MSG="chore(data): no price changes, timestamps only"
          fi
          git add data/
          git commit -m "$MSG"
          git push

      # After the commit, so alerts go out on prices that are being published.
      - name: Send price alerts
        if: steps.fresh.outputs.skip != 'true' && env.ALERTS_SECRET != ''
        run: npm run alerts:send

      # Last, so the stores that did read still publish. A failed or held store's last good
      # prices are carried forward for a few days, so a red run here is a fix-soon, not an
      # outage. The "Read the stores" log says what a held store's prices failed on.
      - name: Fail if any store wasn't updated
        if: steps.fresh.outputs.skip != 'true' && (steps.scrape.outputs.stores_failed != '' || steps.scrape.outputs.stores_held != '')
        env:
          FAILED: ${{ steps.scrape.outputs.stores_failed }}
          HELD: ${{ steps.scrape.outputs.stores_held }}
        run: |
          if [ -n "$FAILED" ]; then echo "::error::Stores that couldn't be read: $FAILED"; fi
          if [ -n "$HELD" ]; then echo "::error::Stores held back by a sanity check: $HELD"; fi
          exit 1
